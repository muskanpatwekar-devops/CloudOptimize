stages:
  - style
  - lint
  - security_scan

variables:
  SHELLCHECK_VERSION: "0.9.0"

shellformat:
  stage: style
  before_script:
    - curl -LJO https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64
    - chmod +x shfmt_v3.8.0_linux_amd64 && mv shfmt_v3.8.0_linux_amd64 shfmt
  script:
    - ./shfmt -i 2 -w .
  only:
    - merge_requests

shellcheck-scan:
  stage: lint
  before_script:
    - curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
  script:
    - shellcheck-v${SHELLCHECK_VERSION}/shellcheck --version
    - find . -type f -name "*.sh" -exec shellcheck-v${SHELLCHECK_VERSION}/shellcheck --severity=warning {} +
  only:
    - merge_requests 

detect-secret:
  stage: security_scan
  before_script:
    - apt update -yq
    - apt install -y python3 python3-pip python3-venv
  script:
    - python3 -m venv detect_secret
    - source detect_secret/bin/activate
    - pip install detect-secrets
    - detect-secrets scan
  only:
    - merge_requests
     